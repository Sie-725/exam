<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 320px;
      background: #fff;
      color: #333;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #3e3f3f;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #2196F3;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #aaa9a9;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #aaa9a9c5;
    }
    #result {
      margin-top: 12px;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
    }
    #result::-webkit-scrollbar {
      width: 6px;
    }
    #result::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h3>Helper</h3>
  <input id="question" placeholder="Question">
  <button id="search">Search</button>
  <div id="result"></div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
